name: Gerar programa para PC (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Montar a página do app
        run: npm run prepare:web

      - name: Gerar o instalador
        run: npm run pc

      - uses: actions/upload-artifact@v4
        with:
          name: orcamentos-a-fernandes-windows
          path: dist-pc/Orcamentos-A-Fernandes-Instalador.exe
          if-no-files-found: error
