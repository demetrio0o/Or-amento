name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Montar a página do app
        run: npm run prepare:web

      - name: Criar projeto Android
        run: npx cap add android

      - name: Ajustar ícone, abertura e versão
        run: python3 scripts/patch-android.py

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Assinar o APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p saida
          PW=$(cat signing/senha.txt)
          "$BT/apksigner" sign --ks signing/release.keystore --ks-key-alias afernandes \
            --ks-pass "pass:$PW" --key-pass "pass:$PW" \
            --out saida/orcamentos-a-fernandes.apk "$UNSIGNED"
          "$BT/apksigner" verify saida/orcamentos-a-fernandes.apk
          ls -l saida

      - uses: actions/upload-artifact@v4
        with:
          name: orcamentos-a-fernandes-apk
          path: saida/orcamentos-a-fernandes.apk
          if-no-files-found: error
